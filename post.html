    function renderMarkdown(source) {
      const text = source || "";
      if (!text) return "";

      const mathParts = [];
      const escaped = text.replace(/\$\$([\s\S]+?)\$\$|\$([^\n$]+?)\$/g, (match, block, inline) => {
        const displayMode = Boolean(block);
        const math = displayMode ? block : inline;
        const rendered = katex.renderToString(math, {
          displayMode,
          throwOnError: false,
          output: "html"
        });
        const token = `@@MATH_${mathParts.length}@@`;
        mathParts.push(rendered);
        return token;
      });

      let html = marked.parse(escaped, { gfm: true, breaks: true, headerIds: false, mangle: false });
      html = html.replace(/@@MATH_(\d+)@@/g, (_, index) => mathParts[Number(index)] || "");
      return html;
    }

    const ADMIN_PASSWORD = "djatldms2@";
    const urlParams = new URLSearchParams(window.location.search);

    const postArea = document.getElementById("postArea");

    function getStoredLikeState() {
      try {
        const stored = JSON.parse(localStorage.getItem("synaptry-liked-posts") || "{}");
        return stored && typeof stored === "object" ? stored : {};
      } catch (error) {
        return {};

    function saveStoredLikeState(likes) {
      localStorage.setItem("synaptry-liked-posts", JSON.stringify(likes));
    }

    function toggleLike() {
      if (!postId || !currentPost) return;

      const likedPosts = getStoredLikeState();
      const isLiked = Boolean(likedPosts[postId]);
      const nextLikes = Math.max(0, Number(currentPost.likes || 0) + (isLiked ? -1 : 1));

      likedPosts[postId] = !isLiked;
      saveStoredLikeState(likedPosts);

      update(ref(db, `posts/${postId}`), { likes: nextLikes })
        .then(() => {
          currentPost.likes = nextLikes;
          const likeButton = document.getElementById("likePostBtn");
          if (likeButton) {
            likeButton.classList.toggle("active", !isLiked);
            likeButton.innerHTML = `${!isLiked ? "👍 추천함" : "👍 추천"} ${nextLikes}`;
          }
        })
        .catch((error) => {
          console.error("좋아요 업데이트 실패:", error);
          alert("좋아요를 반영하지 못했습니다.");
        });
    }

    window.toggleLike = toggleLike;

      const isAuthorMatch = currentPost?.password && inputPw === currentPost.password;

    function handleDeletePost() {
      if (!postId) {
        alert("잘못된 접근입니다.");
        return;
      }

      const rawInput = prompt("포스트를 삭제하려면 비밀번호를 입력하세요:");
      if (rawInput === null) return;

      const inputPw = rawInput.trim();
      const isAuthorMatch = currentPost?.password && inputPw === currentPost.password;
      const isAdminMatch = inputPw === ADMIN_PASSWORD;

      if (isAuthorMatch || isAdminMatch) {
        const confirmMsg = isAdminMatch
          ? "⚡ 관리자 권한으로 이 포스트를 강제 삭제하시겠습니까?"
          : "정말로 이 포스트를 삭제하시겠습니까?";

        if (confirm(confirmMsg)) {

    function toggleFlowView() {
      const flowContainer = document.getElementById("flowDiagramContainer");
      if (flowContainer) {
        flowContainer.classList.toggle("active");
      }
    }

    window.handleEditPost = handleEditPost;
    window.handleDeletePost = handleDeletePost;

    function getCategoryName(cat) {
      const names = { Hardware: "하드웨어", Software: "소프트웨어", Math: "수학", Physics: "물리학", Philosophy: "철학", Etc: "기타" };
      return names[cat] || cat;
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function tokenizeText(raw) {
      const source = String(raw || "").toLowerCase();
      const tokens = source.match(/[가-힣a-z0-9]{2,}/g) || [];
      const stopwords = new Set([
        "그리고", "하지만", "또한", "에서", "으로", "하는", "했다", "합니다", "대한", "이번", "관련", "위한", "통해", "정리", "기반", "경우", "대한", "있다", "없다", "같다", "입니다", "하는지", "about", "with", "from", "that", "this", "there", "have", "will", "into", "using", "used", "your", "you", "what", "when", "where", "which", "while", "can", "are", "the", "and", "for", "how", "why"
      ]);
      return tokens.filter((token) => !stopwords.has(token));
    }

    function buildTermMap(post) {
      const weighted = [];
      const titleTokens = tokenizeText(post.title || "");
      const summaryTokens = tokenizeText(post.summary || "");
      const contentTokens = tokenizeText(post.content || "");

      titleTokens.forEach((token) => weighted.push(token, token, token));
      summaryTokens.forEach((token) => weighted.push(token, token));
      contentTokens.forEach((token) => weighted.push(token));

      const map = {};
      weighted.forEach((token) => {
        map[token] = (map[token] || 0) + 1;
      });
      return map;
    }

    function cosineSimilarity(mapA, mapB) {
      const keysA = Object.keys(mapA);
      const keysB = Object.keys(mapB);
      if (!keysA.length || !keysB.length) return 0;

      let dot = 0;
      let magA = 0;
      let magB = 0;

      keysA.forEach((key) => {
        const value = mapA[key];
        magA += value * value;
        if (mapB[key]) {
          dot += value * mapB[key];
        }
      });

      keysB.forEach((key) => {
        const value = mapB[key];
        magB += value * value;
      });

      if (!magA || !magB) return 0;
      return dot / (Math.sqrt(magA) * Math.sqrt(magB));
    }

    function getCommonKeywords(mapA, mapB, limit = 3) {
      return Object.keys(mapA)
        .filter((key) => mapB[key])
        .map((key) => ({ key, score: Math.min(mapA[key], mapB[key]) }))
        .sort((a, b) => b.score - a.score)
        .slice(0, limit)
        .map((item) => item.key);
    }

    function getRecencyBoost(dateA, dateB) {
      const a = new Date(dateA || 0).getTime();
      const b = new Date(dateB || 0).getTime();
      if (!a || !b) return 0.4;
      const dayDiff = Math.abs(a - b) / (1000 * 60 * 60 * 24);
      return 1 / (1 + dayDiff / 365);
    }

    function truncateTitle(title, max = 14) {
      const value = String(title || "");
      return value.length > max ? `${value.slice(0, max - 1)}…` : value;
    }

    function normalizeCategory(cat) {
      if (!cat) return cat;
      return cat === "Mathmatics" ? "Math" : cat;
    }

    function getCurrentRelatedFilters() {
      const category = relatedCategoryFilter?.value || "ALL";
      const minScore = Math.max(0, Math.min(1, Number(relatedScoreFilter?.value || 20) / 100));
      return { category, minScore };
    }

    function updateRelatedSourceNote() {
      if (!relatedSourceNote) return;

      if (relatedSourceMode === "live") {
        relatedSourceNote.textContent = "실시간 계산 결과를 표시 중입니다.";
        return;
      }

      if (relatedSourceMode === "cache") {
        relatedSourceNote.textContent = "캐시된 연결 결과를 표시 중입니다.";
        return;
      }

      relatedSourceNote.textContent = "연결 구조를 계산하는 중입니다.";
    }

    function createRelatedGraphMarkup(centerPost, relatedPosts) {
      if (!relatedPosts.length) {
        return `<p style="color: var(--text-muted); font-size: 0.9rem;">충분히 유사한 연결 포스트를 찾지 못했습니다.</p>`;
      }

      const width = 900;
      const height = 420;
      const centerX = width / 2;
      const centerY = height / 2;
      const radiusX = Math.min(320, 140 + relatedPosts.length * 28);
      const radiusY = Math.min(160, 90 + relatedPosts.length * 18);

      const edgeMarkup = [];
      const nodeMarkup = [];

      relatedPosts.forEach((item, index) => {
        const angle = (-Math.PI / 2) + (2 * Math.PI * index / relatedPosts.length);
        const x = centerX + radiusX * Math.cos(angle);
        const y = centerY + radiusY * Math.sin(angle);
        const widthByScore = (1.4 + item.score * 5).toFixed(2);
        const opacityByScore = Math.min(0.95, 0.35 + item.score).toFixed(2);

        edgeMarkup.push(`<line x1="${centerX}" y1="${centerY}" x2="${x}" y2="${y}" stroke="var(--accent)" stroke-width="${widthByScore}" stroke-opacity="${opacityByScore}" />`);

        nodeMarkup.push(`
          <a href="post.html?id=${item.id}" aria-label="${escapeHtml(item.title)}">
            <circle cx="${x}" cy="${y}" r="42" class="related-node" />
            <text x="${x}" y="${y - 4}" text-anchor="middle" class="related-node-title">${escapeHtml(truncateTitle(item.title, 16))}</text>
            <text x="${x}" y="${y + 15}" text-anchor="middle" class="related-node-score">${Math.round(item.score * 100)}%</text>
          </a>
        `);
      });

      const centerLabel = escapeHtml(truncateTitle(centerPost.title || "현재 포스트", 20));

      return `
        <svg viewBox="0 0 ${width} ${height}" class="related-graph-svg" role="img" aria-label="관련 포스트 연결 구조도">
          <g>${edgeMarkup.join("")}</g>
          <g>
            ${nodeMarkup.join("")}
            <circle cx="${centerX}" cy="${centerY}" r="54" class="related-node related-node-center" />
            <text x="${centerX}" y="${centerY - 4}" text-anchor="middle" class="related-node-title related-node-title-center">${centerLabel}</text>
            <text x="${centerX}" y="${centerY + 16}" text-anchor="middle" class="related-node-score related-node-score-center">CURRENT</text>
          </g>
        </svg>
      `;
    }

    function computeRelatedCandidatesFromPosts() {
      if (!postId || !currentPost || !allPostsMap || !Object.keys(allPostsMap).length) {
        return [];
      }

      const basePost = { id: postId, ...currentPost };
      const baseMap = buildTermMap(basePost);

      return Object.keys(allPostsMap)
        .filter((id) => id !== postId)
        .map((id) => ({ id, ...allPostsMap[id] }))
        .map((candidate) => {
          const candidateCategory = normalizeCategory(candidate.category);
          const baseCategory = normalizeCategory(basePost.category);
          const candidateMap = buildTermMap(candidate);
          const cosine = cosineSimilarity(baseMap, candidateMap);
          const categoryScore = candidateCategory && baseCategory && candidateCategory === baseCategory ? 1 : 0;
          const recency = getRecencyBoost(basePost.createdAt, candidate.createdAt);
          const finalScore = (0.7 * cosine) + (0.2 * categoryScore) + (0.1 * recency);
          const keywords = getCommonKeywords(baseMap, candidateMap, 3);

          const reasons = [];
          if (keywords.length) {
            reasons.push(`공통 키워드: ${keywords.join(", ")}`);
          }
          if (categoryScore) {
            reasons.push(`같은 카테고리: ${getCategoryName(candidateCategory)}`);
          }
          if ((basePost.aiModel || "") && (candidate.aiModel || "") && basePost.aiModel === candidate.aiModel) {
            reasons.push(`동일 모델: ${candidate.aiModel}`);
          }

          return {
            ...candidate,
            id,
            category: candidateCategory,
            score: finalScore,
            reasons: reasons.length ? reasons : ["본문 주제 유사도 기반 연결"]
          };
        })
        .filter((item) => item.score >= 0.08)
        .sort((a, b) => b.score - a.score)
        .slice(0, 30);
    }

    function buildRelationsCachePayload(candidates) {
      const items = {};

      candidates.slice(0, 30).forEach((item) => {
        items[item.id] = {
          title: item.title || "",
          category: item.category || "",
          aiModel: item.aiModel || "",
          createdAt: item.createdAt || "",
          score: Number(item.score || 0),
          reasons: Array.isArray(item.reasons) ? item.reasons : []
        };
      });

      return {
        meta: {
          savedAt: new Date().toISOString(),
          sourcePostUpdatedAt: currentPost?.updatedAt || currentPost?.createdAt || "",
          postCount: Object.keys(allPostsMap || {}).length
        },
        items
      };
    }

    function saveRelationsCache(candidates) {
      if (!postId) return;
      const payload = buildRelationsCachePayload(candidates);

      set(ref(db, `relations/${postId}`), payload).catch((error) => {
        console.warn("연결 캐시 저장 실패:", error);
      });
    }

    function loadCandidatesFromRelationsCache(cacheData) {
      if (!cacheData || !cacheData.items || typeof cacheData.items !== "object") {
        return [];
      }

      return Object.keys(cacheData.items)
        .map((id) => {
          const item = cacheData.items[id] || {};
          return {
            id,
            title: item.title || "",
            category: normalizeCategory(item.category || ""),
            aiModel: item.aiModel || "",
            createdAt: item.createdAt || "",
            score: Number(item.score || 0),
            reasons: Array.isArray(item.reasons) ? item.reasons : []
          };
        })
        .filter((item) => item.score > 0)
        .sort((a, b) => b.score - a.score);
    }

    function getFilteredRelatedCandidates() {
      const { category, minScore } = getCurrentRelatedFilters();
      return relatedCandidates.filter((item) => {
        if (item.score < minScore) return false;
        if (category !== "ALL" && normalizeCategory(item.category) !== category) return false;
        return true;
      });
    }

    function recomputeAndPersistRelatedCandidates() {
      const canComputeLive = Boolean(postId && currentPost && allPostsMap && Object.keys(allPostsMap).length);
      if (!canComputeLive) {
        renderRelatedPosts();
        return;
      }

      relatedCandidates = computeRelatedCandidatesFromPosts();
      relatedSourceMode = "live";
      updateRelatedSourceNote();
      renderRelatedPosts();
      saveRelationsCache(relatedCandidates);
    }

    function renderRelatedPosts() {
      if (!postId || !currentPost) {
        return;
      }

      if (!relatedCandidates.length) {
        if (!allPostsMap || !Object.keys(allPostsMap).length) {
          relatedPostsGraph.innerHTML = `<p style="color: var(--text-muted); font-size: 0.9rem;">포스트 전체 목록 접근이 제한되어 있어 캐시된 연결 정보를 기다리는 중입니다.</p>`;
          relatedPostsList.innerHTML = `<p style="color: var(--text-muted); font-size: 0.9rem;">아직 불러온 연결 데이터가 없습니다.</p>`;
          return;
        }

        relatedPostsGraph.innerHTML = `<p style="color: var(--text-muted); font-size: 0.9rem;">충분히 유사한 연결 포스트를 찾지 못했습니다.</p>`;
        relatedPostsList.innerHTML = `<p style="color: var(--text-muted); font-size: 0.9rem;">유사도 점수를 만족하는 포스트가 없습니다.</p>`;
        return;
      }

      const basePost = { id: postId, ...currentPost };
      const filteredRelated = getFilteredRelatedCandidates();
      const graphNodes = filteredRelated.slice(0, 5);

      relatedPostsGraph.innerHTML = createRelatedGraphMarkup(basePost, graphNodes);

      if (!filteredRelated.length) {
        relatedPostsList.innerHTML = `<p style="color: var(--text-muted); font-size: 0.9rem;">필터 조건에 맞는 연결 포스트가 없습니다. 카테고리 또는 최소 유사도 조건을 완화해 보세요.</p>`;
        return;
      }

      relatedPostsList.innerHTML = filteredRelated.slice(0, 10).map((item, index) => {
        const reasonText = item.reasons.map((reason) => `<li>${escapeHtml(reason)}</li>`).join("");
        const scorePercent = Math.round(item.score * 100);
        return `
          <a class="related-post-item" href="post.html?id=${item.id}">
            <div class="related-post-rank">#${index + 1}</div>
            <div class="related-post-main">
              <div class="related-post-heading">
                <strong>${escapeHtml(item.title || "제목 없음")}</strong>
                <span class="related-post-score">${scorePercent}%</span>
              </div>
              <ul class="related-post-reasons">${reasonText}</ul>
            </div>
          </a>
        `;
      }).join("");
    }

    function isCommentAuthorized(comment, inputPw) {
      const password = (inputPw || "").trim();
      const isAdminMatch = password === ADMIN_PASSWORD;
      const isAuthorMatch = comment?.password && password === comment.password;
      return { isAuthorized: Boolean(isAdminMatch || isAuthorMatch), isAdminMatch };
    }

    function ensureCommentAuthorization(comment, actionLabel) {
      const rawInput = prompt(`댓글을 ${actionLabel}하려면 비밀번호를 입력하세요:`);
      if (rawInput === null) return null;

      const { isAuthorized, isAdminMatch } = isCommentAuthorized(comment, rawInput);
      if (!isAuthorized) {
        alert("비밀번호가 일치하지 않습니다. (관리자 비밀번호 또는 작성 시 입력한 비밀번호)");
        return null;
      }

      return { isAdminMatch };
    }

    window.handleEditComment = (commentId) => {
      const comment = currentComments[commentId];
      if (!comment) {
        alert("댓글 정보를 찾을 수 없습니다.");
        return;
      }

      const authResult = ensureCommentAuthorization(comment, "수정");
      if (!authResult) return;

      const rawContent = prompt("수정할 댓글 내용을 입력하세요:", comment.content || "");
      if (rawContent === null) return;

      const nextContent = rawContent.trim();
      if (!nextContent) {
        alert("댓글 내용을 입력해주세요.");
        return;
      }

      update(ref(db, `comments/${postId}/${commentId}`), {
        content: nextContent,
        updatedAt: new Date().toISOString()
      }).catch((error) => {
        console.error("댓글 수정 실패:", error);
        alert("댓글 수정 중 오류가 발생했습니다.");
      });
    };

    window.handleDeleteComment = (commentId) => {
      const comment = currentComments[commentId];
      if (!comment) {
        alert("댓글 정보를 찾을 수 없습니다.");
        return;
      }

      const authResult = ensureCommentAuthorization(comment, "삭제");
      if (!authResult) return;

      const isReply = Boolean(comment.parentId);
      const confirmMsg = isReply
        ? "이 답글을 삭제하시겠습니까?"
        : "이 댓글과 연결된 답글까지 모두 삭제하시겠습니까?";

      if (!confirm(confirmMsg)) return;

      const deletionTasks = [remove(ref(db, `comments/${postId}/${commentId}`))];

      if (!isReply) {
        Object.keys(currentComments).forEach((key) => {
          if (currentComments[key]?.parentId === commentId) {
            deletionTasks.push(remove(ref(db, `comments/${postId}/${key}`)));
          }
        });
      }

      Promise.all(deletionTasks).catch((error) => {
        console.error("댓글 삭제 실패:", error);
        alert("댓글 삭제 중 오류가 발생했습니다.");
      });
    };

    if (!postId) {
      postArea.innerHTML = "<h2>잘못된 접근입니다.</h2>";
    } else {
      relatedSourceMode = "loading";
      updateRelatedSourceNote();

      onValue(ref(db, `relations/${postId}`), (snapshot) => {
        const cached = snapshot.val();
        const cachedCandidates = loadCandidatesFromRelationsCache(cached);

        if (cachedCandidates.length && (!relatedCandidates.length || relatedSourceMode !== "live")) {
          relatedCandidates = cachedCandidates;
          relatedSourceMode = "cache";
          updateRelatedSourceNote();
          renderRelatedPosts();
        }
      }, (error) => {
        console.warn("연결 캐시 로드 실패:", error);
      });

      onValue(ref(db, "posts"), (snapshot) => {
        allPostsMap = snapshot.val() || {};
        recomputeAndPersistRelatedCandidates();
      }, (error) => {
        console.error("연결 포스트 목록 로드 실패:", error);
        allPostsMap = {};
        renderRelatedPosts();
      });

      onValue(ref(db, `posts/${postId}`), (snapshot) => {
        const post = snapshot.val();
        if (!post) {
          postArea.innerHTML = "<h2>삭제되었거나 존재하지 않는 포스트입니다.</h2>";
          relatedPostsGraph.innerHTML = `<p style="color: var(--text-muted); font-size: 0.9rem;">포스트를 찾을 수 없어 연결 정보를 표시할 수 없습니다.</p>`;
          relatedPostsList.innerHTML = "";
          return;
        }

        currentPost = post;
        if (!allPostsMap[postId]) {
          allPostsMap[postId] = post;
        }
        const dateStr = post.createdAt ? post.createdAt.split("T")[0].replace(/-/g, ".") : "";
        const likedPosts = getStoredLikeState();
        const isLiked = Boolean(likedPosts[postId]);
        const likeCount = Number(post.likes || 0);

        postArea.innerHTML = `
          <div class="post-header">
            <h2>${post.title}</h2>
            <div class="post-meta-wrap">
              <div class="post-meta">
                <span>👤 ${post.author || '익명'}</span>
                <span>🏷️ ${getCategoryName(post.category)}</span>
                <span>📅 ${dateStr}</span>
                <span>🤖 ${post.aiModel || 'AI Collaboration'}</span>
              </div>
              <div class="action-btn-group">
                <button class="btn-action ${isLiked ? 'active' : ''}" id="likePostBtn" type="button" onclick="toggleLike()">${isLiked ? '👍 추천함' : '👍 추천'} ${likeCount}</button>
                <button class="btn-edit-post" id="editPostBtn" type="button" onclick="handleEditPost()">✏️ 수정하기</button>
                <button class="btn-delete-post" id="deletePostBtn" type="button" onclick="handleDeletePost()">🗑️ 삭제</button>
              </div>
            </div>
            
            ${post.summary ? `
              <div class="post-summary-box">
                <strong>💬 시작 프롬프트</strong>
                <div class="post-summary-markdown">${renderMarkdown(post.summary || "")}</div>
              </div>
            ` : ''}
          </div>
          
          <div class="post-content" id="mainPostContent">${renderMarkdown(post.content || "")}</div>
        `;

        setupFlowDiagram(post);
        recomputeAndPersistRelatedCandidates();
      });

      onValue(ref(db, `comments/${postId}`), (snapshot) => {
        const comments = snapshot.val();
        currentComments = comments || {};
        commentsList.innerHTML = "";

        if (!comments) {
          commentsList.innerHTML = `<p style="color: var(--text-muted); font-size: 0.9rem;">첫 번째 댓글을 작성해 보세요!</p>`;
          return;
        }

        Object.keys(comments)
          .sort((a, b) => new Date(comments[a]?.createdAt || 0) - new Date(comments[b]?.createdAt || 0))
          .forEach((key) => {
          const c = comments[key];
          const isReply = !!c.parentId;
          const dateStr = new Date(c.createdAt).toLocaleString("ko-KR");
          const editedLabel = c.updatedAt ? `<span class="comment-updated">(수정됨)</span>` : "";

          const commentEl = document.createElement("div");
          commentEl.className = `comment-card ${isReply ? 'reply' : ''}`;
          commentEl.innerHTML = `
            <div class="comment-meta">
              <span class="comment-author">${c.author}</span>
              <span>${dateStr} ${editedLabel}</span>
            </div>
            <div class="comment-content">${c.content}</div>
            <div class="comment-actions">
              ${!isReply ? `<button class="btn-reply-toggle" type="button" onclick="toggleReplyForm('${key}')">↳ 답글 달기</button>` : ''}
              <button class="btn-comment-action" type="button" onclick="handleEditComment('${key}')">✏️ 수정</button>
              <button class="btn-comment-action btn-comment-action--danger" type="button" onclick="handleDeleteComment('${key}')">🗑️ 삭제</button>
            </div>
            
            <div id="replyForm-${key}" class="reply-form">
              <div class="reply-form-row">
                <input type="text" id="replyAuthor-${key}" placeholder="작성자 이름" style="width:100%; margin-bottom:6px; padding:6px; background:var(--card-bg); border:1px solid var(--border); color:var(--text-main); border-radius:4px;">
                <input type="password" id="replyPassword-${key}" placeholder="비밀번호(선택)" style="width:100%; margin-bottom:6px; padding:6px; background:var(--card-bg); border:1px solid var(--border); color:var(--text-main); border-radius:4px;">
              </div>
              <textarea id="replyContent-${key}" placeholder="답글을 입력하세요..." style="width:100%; height:50px; padding:6px; background:var(--card-bg); border:1px solid var(--border); color:var(--text-main); border-radius:4px; margin-bottom:6px;"></textarea>
              <button type="button" class="btn-submit" style="padding:4px 12px; font-size:0.8rem;" onclick="submitReply('${key}')">답글 등록</button>
            </div>
          `;
          commentsList.appendChild(commentEl);
          });
      });
    }

    function setupFlowDiagram(post) {
      const flowTimeline = document.getElementById("flowTimeline");

      let flowNodes = [];

      if (post.flow && Array.isArray(post.flow) && post.flow.length > 0) {
        flowNodes = post.flow
          .slice()
          .sort((a, b) => Number(a.order || 0) - Number(b.order || 0));
      } else {
        if (post.summary) {
          flowNodes.push({
            title: "🚀 시작 프롬프트 (초기 논제)",
            summary: post.summary,
            order: 1
          });
        }

        const tempDiv = document.createElement("div");
        tempDiv.innerHTML = post.content || "";
        const headings = tempDiv.querySelectorAll("h1, h2, h3, h4, strong");

        headings.forEach((h, idx) => {
          let nextElem = h.nextElementSibling;
          let contentSnippet = "";
          while (nextElem && !['H1','H2','H3','H4'].includes(nextElem.tagName)) {
            contentSnippet += (nextElem.innerText || nextElem.textContent || "") + " ";
            nextElem = nextElem.nextElementSibling;
          }

          const nodeTitle = h.innerText || h.textContent;
          if (nodeTitle && nodeTitle.trim().length > 0) {
            flowNodes.push({
              title: nodeTitle.trim(),
              summary: contentSnippet.trim().substring(0, 220) + (contentSnippet.length > 220 ? "..." : "") || "세부 내용 요약이 등록되지 않았습니다.",
              order: (post.summary ? 1 : 0) + idx + 1
            });
          }
        });

        if (flowNodes.length === (post.summary ? 1 : 0)) {
          const textContent = tempDiv.innerText || tempDiv.textContent || "";
          const paragraphs = textContent.split("\n\n").filter(p => p.trim().length > 0);
          paragraphs.forEach((p, idx) => {
            flowNodes.push({
              title: `대화/탐구 단계 ${idx + 1}`,
              summary: p.substring(0, 180) + (p.length > 180 ? "..." : ""),
              order: (post.summary ? 1 : 0) + idx + 1
            });
          });
        }
      }

      flowTimeline.innerHTML = "";

      if (!flowNodes.length) {
        flowTimeline.innerHTML = '<div class="flow-empty">등록된 흐름 정보가 없습니다.</div>';
        return;
      }

      flowNodes
        .sort((a, b) => Number(a.order || 0) - Number(b.order || 0))
        .forEach((node, index) => {
          const stepEl = document.createElement("div");
          stepEl.className = "flow-step";
          stepEl.innerHTML = `
            <div class="flow-step-header">
              <span class="flow-step-title">${index + 1}. ${node.title || "단계"}</span>
              <span class="flow-step-badge">순서 ${index + 1}</span>
            </div>
            <div class="flow-step-summary">${node.summary || "내용이 없습니다."}</div>
          `;
          flowTimeline.appendChild(stepEl);
        });
    }

    if (relatedScoreValue && relatedScoreFilter) {
      relatedScoreValue.textContent = `${relatedScoreFilter.value}%`;
      relatedScoreFilter.addEventListener("input", () => {
        relatedScoreValue.textContent = `${relatedScoreFilter.value}%`;
        renderRelatedPosts();
      });
    }

    if (relatedCategoryFilter) {
      relatedCategoryFilter.addEventListener("change", () => {
        renderRelatedPosts();
      });
    }

    document.getElementById("commentForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const author = document.getElementById("commentAuthor").value.trim();
      const content = document.getElementById("commentContent").value.trim();
      const password = document.getElementById("commentPassword").value.trim();

      if (!author || !content) {
        alert("작성자 이름과 댓글 내용을 입력해주세요.");
        return;
      }

      push(ref(db, `comments/${postId}`), {
        author: author,
        content: content,
        password: password || null,
        createdAt: new Date().toISOString(),
        parentId: null
      }).then(() => {
        document.getElementById("commentContent").value = "";
        document.getElementById("commentPassword").value = "";
      });
    });

    window.toggleReplyForm = (commentId) => {
      const form = document.getElementById(`replyForm-${commentId}`);
      form.style.display = form.style.display === "block" ? "none" : "block";
    };

    window.submitReply = (parentId) => {
      const author = document.getElementById(`replyAuthor-${parentId}`).value.trim();
      const content = document.getElementById(`replyContent-${parentId}`).value.trim();
      const password = document.getElementById(`replyPassword-${parentId}`).value.trim();

      if (!author || !content) {
        alert("이름과 답글 내용을 입력해주세요.");
        return;
      }

      push(ref(db, `comments/${postId}`), {
        author: author,
        content: content,
        password: password || null,
        createdAt: new Date().toISOString(),
        parentId: parentId
      }).then(() => {
        document.getElementById(`replyForm-${parentId}`).style.display = "none";
        document.getElementById(`replyAuthor-${parentId}`).value = "";
        document.getElementById(`replyContent-${parentId}`).value = "";
        document.getElementById(`replyPassword-${parentId}`).value = "";
      });
    };
  </script>
</body>
</html>
