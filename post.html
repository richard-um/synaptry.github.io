<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBDEWtLLRoM0UbJgrcSfDRQRiiN7lclz6o",
      authDomain: "synaptry-db.firebaseapp.com",
      databaseURL: "https://synaptry-db-default-rtdb.firebaseio.com",
      projectId: "synaptry-db",
      storageBucket: "synaptry-db.firebasestorage.app",
      messagingSenderId: "980184606882",
      appId: "1:980184606882:web:c5302bdf71b63e37db4ffb"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 관리자 암호 "djatldms2@" (Base64 인코딩하여 소스코드에 원문 직접 노출 방지)
    const ADMIN_PW_ENCODED = "ZGphdGxkbXMyQA=="; // atob("ZGphdGxkbXMyQA==") === "djatldms2@"

    const urlParams = new URLSearchParams(window.location.search);
    const postId = urlParams.get('id');

    const postArea = document.getElementById("postArea");
    const commentsList = document.getElementById("commentsList");

    function getCategoryName(cat) {
      const names = { Hardware: "하드웨어", Software: "소프트웨어", Math: "수학", Physics: "물리학", Philosophy: "철학", Etc: "기타" };
      return names[cat] || cat;
    }

    if (!postId) {
      postArea.innerHTML = "<h2>잘못된 접근입니다.</h2>";
    } else {
      // 1. 포스트 데이터 로드
      onValue(ref(db, `posts/${postId}`), (snapshot) => {
        const post = snapshot.val();
        if (!post) {
          postArea.innerHTML = "<h2>삭제되었거나 존재하지 않는 포스트입니다.</h2>";
          return;
        }

        const dateStr = post.createdAt ? post.createdAt.split("T")[0].replace(/-/g, ".") : "";
        const parsedContent = marked.parse(post.content || "");

        postArea.innerHTML = `
          <div class="post-header">
            <h2>${post.title}</h2>
            <div class="post-meta-wrap">
              <div class="post-meta">
                <span>👤 ${post.author || '익명'}</span>
                <span>🏷️ ${getCategoryName(post.category)}</span>
                <span>📅 ${dateStr}</span>
                <span>🤖 ${post.aiModel || 'AI Collaboration'}</span>
              </div>
              <button class="btn-delete-post" id="deletePostBtn">🗑️ 삭제</button>
            </div>
            ${post.summary ? `<p style="margin-top:15px; color:var(--accent);">💡 요약: ${post.summary}</p>` : ''}
          </div>
          <div class="post-content">${parsedContent}</div>
        `;

        // 삭제 처리 로직 (작성자 비밀번호 OR 관리자 마스터 비밀번호)
        document.getElementById("deletePostBtn").addEventListener("click", () => {
          const rawInput = prompt("포스트를 삭제하려면 비밀번호를 입력하세요:");
          if (rawInput === null) return;

          const inputPw = rawInput.trim(); // 앞뒤 공백 제거

          const isAuthorPasswordMatch = post.password && inputPw === post.password;
          const isAdminPasswordMatch = inputPw === atob(ADMIN_PW_ENCODED); // "djatldms2@" 와 대조

          if (isAuthorPasswordMatch || isAdminPasswordMatch) {
            const confirmMsg = isAdminPasswordMatch 
              ? "⚡ 관리자 권한으로 이 포스트를 강제 삭제하시겠습니까?" 
              : "정말로 이 포스트를 삭제하시겠습니까?";

            if (confirm(confirmMsg)) {
              remove(ref(db, `posts/${postId}`));
              remove(ref(db, `comments/${postId}`));
              alert("포스트가 성공적으로 삭제되었습니다.");
              window.location.href = "index.html";
            }
          } else {
            alert("비밀번호가 일치하지 않습니다.");
          }
        });
      });

      // 2. 댓글 및 답글 로드
      onValue(ref(db, `comments/${postId}`), (snapshot) => {
        const comments = snapshot.val();
        commentsList.innerHTML = "";

        if (!comments) {
          commentsList.innerHTML = `<p style="color: var(--text-muted); font-size: 0.9rem;">첫 번째 댓글을 작성해 보세요!</p>`;
          return;
        }

        Object.keys(comments).forEach((key) => {
          const c = comments[key];
          const isReply = !!c.parentId;
          const dateStr = new Date(c.createdAt).toLocaleString("ko-KR");

          const commentEl = document.createElement("div");
          commentEl.className = `comment-card ${isReply ? 'reply' : ''}`;
          commentEl.innerHTML = `
            <div class="comment-meta">
              <span class="comment-author">${c.author}</span>
              <span>${dateStr}</span>
            </div>
            <div>${c.content}</div>
            ${!isReply ? `<button class="btn-reply-toggle" onclick="toggleReplyForm('${key}')">↳ 답글 달기</button>` : ''}
            
            <div id="replyForm-${key}" class="reply-form">
              <input type="text" id="replyAuthor-${key}" placeholder="작성자 이름" style="width:100%; margin-bottom:6px; padding:6px; background:var(--card-bg); border:1px solid var(--border); color:var(--text-main); border-radius:4px;">
              <textarea id="replyContent-${key}" placeholder="답글을 입력하세요..." style="width:100%; height:50px; padding:6px; background:var(--card-bg); border:1px solid var(--border); color:var(--text-main); border-radius:4px; margin-bottom:6px;"></textarea>
              <button type="button" class="btn-submit" style="padding:4px 12px; font-size:0.8rem;" onclick="submitReply('${key}')">답글 등록</button>
            </div>
          `;
          commentsList.appendChild(commentEl);
        });
      });
    }

    // 댓글 등록
    document.getElementById("commentForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const author = document.getElementById("commentAuthor").value;
      const content = document.getElementById("commentContent").value;

      push(ref(db, `comments/${postId}`), {
        author: author,
        content: content,
        createdAt: new Date().toISOString(),
        parentId: null
      }).then(() => {
        document.getElementById("commentContent").value = "";
      });
    });

    window.toggleReplyForm = (commentId) => {
      const form = document.getElementById(`replyForm-${commentId}`);
      form.style.display = form.style.display === "block" ? "none" : "block";
    };

    window.submitReply = (parentId) => {
      const author = document.getElementById(`replyAuthor-${parentId}`).value;
      const content = document.getElementById(`replyContent-${parentId}`).value;

      if (!author || !content) {
        alert("이름과 답글 내용을 입력해주세요.");
        return;
      }

      push(ref(db, `comments/${postId}`), {
        author: author,
        content: content,
        createdAt: new Date().toISOString(),
        parentId: parentId
      }).then(() => {
        document.getElementById(`replyForm-${parentId}`).style.display = "none";
      });
    };
  </script>
