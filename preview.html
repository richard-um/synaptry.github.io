<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synaptry | Post Preview</title>
  <link rel="stylesheet" href="styles.css">
  
  <!-- 마크다운 렌더링 라이브러리 (Marked.js) CDN -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    .post-detail-container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
    .preview-badge {
      display: inline-block;
      background: #f59e0b;
      color: #000;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      margin-bottom: 10px;
    }
    .post-header { border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 30px; }
    .post-meta { display: flex; gap: 15px; color: var(--text-muted); font-size: 0.9rem; margin-top: 10px; }
    
    /* 마크다운 스타일 */
    .post-content { line-height: 1.8; font-size: 1.05rem; margin-bottom: 50px; }
    .post-content h1, .post-content h2, .post-content h3, .post-content h4 { margin-top: 24px; margin-bottom: 12px; color: var(--accent); }
    .post-content p { margin-bottom: 16px; }
    .post-content ul, .post-content ol { padding-left: 20px; margin-bottom: 16px; }
    .post-content blockquote { border-left: 4px solid var(--accent); padding-left: 15px; color: var(--text-muted); margin: 16px 0; }
    .post-content pre { background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; padding: 16px; overflow-x: auto; margin: 16px 0; }
    .post-content code { background: rgba(255, 255, 255, 0.1); padding: 2px 6px; border-radius: 4px; font-family: monospace; }
    .post-content pre code { background: none; padding: 0; }
    .post-content table { width: 100%; border-collapse: collapse; margin: 20px 0; }
    .post-content th, .post-content td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
    .post-content th { background: var(--card-bg); color: var(--accent); }
    .post-content img { max-width: 100%; height: auto; border-radius: 6px; margin: 16px 0; }
  </style>
</head>
<body>
  <header>
    <div class="container header-container">
      <a href="./"><img src="wide_white_trans.png" alt="Synaptry" class="logo-img"></a>
      <p class="subtitle">AI와의 대화로 넓혀가는 기술, 수학, 그리고 철학의 지평</p>
    </div>
  </header>

  <main class="post-detail-container">
    <span class="preview-badge">👁️ 미리보기 모드 (저장되지 않은 상태입니다)</span>
    <div id="postArea">
      <p style="color: var(--text-muted);">미리보기를 불러오는 중입니다...</p>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 Synaptry. Powered by AI Collaboration.</p>
    </div>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const previewData = JSON.parse(sessionStorage.getItem("synaptry_preview_data") || "{}");
      const postArea = document.getElementById("postArea");

      if (!previewData.content && !previewData.title) {
        postArea.innerHTML = "<h2>미리볼 데이터가 없습니다.</h2>";
        return;
      }

      function getCategoryName(cat) {
        const names = { Hardware: "하드웨어", Software: "소프트웨어", Math: "수학", Physics: "물리학", Philosophy: "철학", Etc: "기타" };
        return names[cat] || cat;
      }

      const parsedContent = marked.parse(previewData.content || "");
      const dateStr = new Date().toISOString().split("T")[0].replace(/-/g, ".");

      postArea.innerHTML = `
        <div class="post-header">
          <h2>${previewData.title || '제목 없음'}</h2>
          <div class="post-meta">
            <span>👤 ${previewData.author || '익명'}</span>
            <span>🏷️ ${getCategoryName(previewData.category)}</span>
            <span>📅 ${dateStr}</span>
            <span>🤖 ${previewData.aiModel || 'AI Collaboration'}</span>
          </div>
          ${previewData.summary ? `<p style="margin-top:15px; color:var(--accent);">💡 요약: ${previewData.summary}</p>` : ''}
        </div>
        <div class="post-content">${parsedContent}</div>
      `;
    });
  </script>
</body>
</html>
