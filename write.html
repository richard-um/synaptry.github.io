<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synaptry | Write Post</title>
  <link rel="stylesheet" href="styles.css">

  <style>
    /* 다변화된 마크다운 툴바 스타일 */
    .md-toolbar {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
      flex-wrap: wrap;
      background: var(--card-bg);
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .md-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .md-btn:hover {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border-color: var(--accent);
    }
    .md-divider {
      width: 1px;
      background: var(--border);
      margin: 0 4px;
    }
    
    .form-row { display: flex; gap: 15px; }
    .form-row .form-group { flex: 1; }

    .btn-preview {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid #f59e0b;
      color: #f59e0b;
      padding: 8px 18px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .btn-preview:hover {
      background: #f59e0b;
      color: #000;
    }

    textarea#content {
      width: 100%;
      height: 420px;
      resize: vertical;
      line-height: 1.6;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <header>
    <div class="container header-container">
      <a href="./"><img src="wide_white_trans.png" alt="Synaptry" class="logo-img"></a>
      <p class="subtitle">AI와의 대화로 넓혀가는 기술, 수학, 그리고 철학의 지평</p>
    </div>
  </header>

  <main class="write-container">
    <h2>✍️ 새 포스트 기록하기</h2>
    <form id="postForm" style="margin-top: 20px;">
      
      <!-- 작성자 & 비밀번호 입력란 -->
      <div class="form-row">
        <div class="form-group">
          <label for="author">작성자 이름</label>
          <input type="text" id="author" required placeholder="작성자 이름을 입력하세요">
        </div>
        <div class="form-group">
          <label for="password">삭제 비밀번호</label>
          <input type="password" id="password" required placeholder="포스트 삭제 시 필요한 비밀번호">
        </div>
      </div>

      <div class="form-group">
        <label for="title">제목</label>
        <input type="text" id="title" required placeholder="포스트 제목을 입력하세요">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="category">카테고리</label>
          <select id="category">
            <option value="Hardware">하드웨어 (Hardware)</option>
            <option value="Software">소프트웨어 (Software)</option>
            <option value="Math">수학 (Mathematics)</option>
            <option value="Physics">물리학 (Physics)</option>
            <option value="Philosophy">철학 (Philosophy)</option>
            <option value="Etc">기타 (Etc)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="aiModel">사용된 AI 모델</label>
          <input type="text" id="aiModel" placeholder="예: Gemini 1.5 Pro, Claude 3.5 Sonnet">
        </div>
      </div>

      <div class="form-group">
        <label for="summary">요약 (Summary)</label>
        <input type="text" id="summary" placeholder="핵심 내용 한 줄 요약">
      </div>
      
      <!-- 마크다운 에디터 (다양한 툴바 지원) -->
      <div class="form-group">
        <label for="content">본문 내용 (Markdown 지원)</label>
        
        <div class="md-toolbar">
          <!-- 제목 레벨 -->
          <button type="button" class="md-btn" onclick="insertMD('# ', '')">H1</button>
          <button type="button" class="md-btn" onclick="insertMD('## ', '')">H2</button>
          <button type="button" class="md-btn" onclick="insertMD('### ', '')">H3</button>
          <div class="md-divider"></div>
          
          <!-- 서식 -->
          <button type="button" class="md-btn" onclick="insertMD('**', '**')"><b>B</b> 굵게</button>
          <button type="button" class="md-btn" onclick="insertMD('*', '*')"><i>I</i> 기울임</button>
          <button type="button" class="md-btn" onclick="insertMD('~~', '~~')"><s>S</s> 취소선</button>
          <button type="button" class="md-btn" onclick="insertMD('`', '`')">Inline Code</button>
          <div class="md-divider"></div>

          <!-- 블록/기능 요소 -->
          <button type="button" class="md-btn" onclick="insertMD('```\n', '\n```')">💻 코드블록</button>
          <button type="button" class="md-btn" onclick="insertMD('> ', '')">💬 인용구</button>
          <button type="button" class="md-btn" onclick="insertMD('- ', '')">• 목록</button>
          <button type="button" class="md-btn" onclick="insertMD('1. ', '')">1. 숫자목록</button>
          <button type="button" class="md-btn" onclick="insertMD('- [ ] ', '')">☑️ 체크리스트</button>
          <div class="md-divider"></div>

          <!-- 미디어/표/기타 -->
          <button type="button" class="md-btn" onclick="insertMD('[', '](https://)')">🔗 링크</button>
          <button type="button" class="md-btn" onclick="insertMD('![설명](', ')')">🖼️ 이미지</button>
          <button type="button" class="md-btn" onclick="insertMD('| 헤더1 | 헤더2 |\n| --- | --- |\n| 내용1 | 내용2 |', '')">📊 표</button>
          <button type="button" class="md-btn" onclick="insertMD('\n---\n', '')">➖ 구분선</button>
        </div>

        <textarea id="content" required placeholder="AI와의 대화 기록, 마크다운 문법, 코드 등을 자유롭게 작성하세요."></textarea>
      </div>

      <div class="btn-group" style="display: flex; gap: 10px; justify-content: flex-end; align-items: center;">
        <button type="button" class="btn-preview" onclick="openPreview()">👁️ 미리보기</button>
        <a href="index.html" class="btn-cancel">취소</a>
        <button type="submit" class="btn-submit">저장 및 게시</button>
      </div>
    </form>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2026 Synaptry. Powered by AI Collaboration.</p>
    </div>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBDEWtLLRoM0UbJgrcSfDRQRiiN7lclz6o",
      authDomain: "synaptry-db.firebaseapp.com",
      databaseURL: "https://synaptry-db-default-rtdb.firebaseio.com",
      projectId: "synaptry-db",
      storageBucket: "synaptry-db.firebasestorage.app",
      messagingSenderId: "980184606882",
      appId: "1:980184606882:web:c5302bdf71b63e37db4ffb"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const contentTextarea = document.getElementById("content");

    // 툴바 버튼 클릭 시 커서 위치에 문법 삽입
    window.insertMD = (before, after) => {
      const start = contentTextarea.selectionStart;
      const end = contentTextarea.selectionEnd;
      const selected = contentTextarea.value.substring(start, end);
      const replacement = before + selected + after;
      
      contentTextarea.value = contentTextarea.value.substring(0, start) + replacement + contentTextarea.value.substring(end);
      contentTextarea.focus();
      contentTextarea.setSelectionRange(start + before.length, end + before.length);
    };

    // preview.html 페이지로 팝업/새 창 띄우기
    window.openPreview = () => {
      const previewData = {
        author: document.getElementById("author").value,
        title: document.getElementById("title").value,
        category: document.getElementById("category").value,
        aiModel: document.getElementById("aiModel").value,
        summary: document.getElementById("summary").value,
        content: contentTextarea.value
      };

      sessionStorage.setItem("synaptry_preview_data", JSON.stringify(previewData));
      window.open("preview.html", "_blank");
    };

    // 폼 제출 (Firebase 저장)
    document.getElementById("postForm").addEventListener("submit", (e) => {
      e.preventDefault();

      const postData = {
        author: document.getElementById("author").value,
        password: document.getElementById("password").value,
        title: document.getElementById("title").value,
        category: document.getElementById("category").value,
        aiModel: document.getElementById("aiModel").value,
        summary: document.getElementById("summary").value,
        content: contentTextarea.value,
        createdAt: new Date().toISOString()
      };

      push(ref(db, "posts"), postData)
        .then(() => {
          alert("포스트가 성공적으로 등록되었습니다!");
          window.location.href = "index.html";
        })
        .catch((err) => alert("저장 실패: " + err.message));
    });
  </script>
</body>
</html>
