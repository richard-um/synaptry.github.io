<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synaptry | Write Post</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .write-container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: var(--accent); }
    .form-control { width: 100%; padding: 12px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text-main); font-size: 1rem; box-sizing: border-box; }
    .form-control:focus { outline: none; border-color: var(--accent); }
    textarea.form-control { height: 350px; resize: vertical; font-family: monospace; line-height: 1.5; }
    .form-row { display: flex; gap: 20px; }
    .form-row .form-group { flex: 1; }
    .btn-group { display: flex; justify-content: flex-end; gap: 10px; margin-top: 30px; }
    .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text-muted); }
    .btn-secondary:hover { border-color: var(--text-main); color: var(--text-main); }
  </style>
</head>
<body>
  <header>
    <div class="container header-container">
      <a href="./"><img src="wide_white_trans.png" alt="Synaptry" class="logo-img"></a>
      <p class="subtitle">AI와의 대화로 넓혀가는 기술, 수학, 그리고 철학의 지평</p>
    </div>
  </header>

  <main class="write-container">
    <h2>✍️ 새 포스트 작성</h2>
    <form id="writeForm" style="margin-top: 20px;">
      
      <div class="form-group">
        <label for="title">제목</label>
        <input type="text" id="title" class="form-control" required placeholder="포스트 제목을 입력하세요">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="author">작성자</label>
          <input type="text" id="author" class="form-control" placeholder="이름 또는 닉네임" required>
        </div>
        <div class="form-group">
          <label for="category">카테고리</label>
          <select id="category" class="form-control" required>
            <option value="Hardware">하드웨어</option>
            <option value="Software">소프트웨어</option>
            <option value="Math">수학</option>
            <option value="Physics">물리학</option>
            <option value="Philosophy">철학</option>
            <option value="Etc">기타</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="aiModel">사용한 AI 모델</label>
          <input type="text" id="aiModel" class="form-control" placeholder="예: Claude 3.5 Sonnet, ChatGPT-4o">
        </div>
        <div class="form-group">
          <label for="password">삭제 비밀번호</label>
          <input type="password" id="password" class="form-control" placeholder="포스트 삭제 시 필요" required>
        </div>
      </div>

      <div class="form-group">
        <label for="summary">한 줄 요약 (선택)</label>
        <input type="text" id="summary" class="form-control" placeholder="포스트의 핵심 내용을 한 문장으로 요약해 주세요">
      </div>

      <div class="form-group">
        <label for="content">본문 내용 (마크다운 지원)</label>
        <textarea id="content" class="form-control" required placeholder="마크다운 문법을 사용하여 자유롭게 작성하세요..."></textarea>
      </div>

      <div class="btn-group">
        <button type="button" class="btn-submit btn-secondary" onclick="history.back()">취소</button>
        <button type="button" id="previewBtn" class="btn-submit btn-secondary">👁️ 미리보기</button>
        <button type="submit" class="btn-submit">🚀 발행하기</button>
      </div>

    </form>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBDEWtLLRoM0UbJgrcSfDRQRiiN7lclz6o",
      authDomain: "synaptry-db.firebaseapp.com",
      databaseURL: "https://synaptry-db-default-rtdb.firebaseio.com",
      projectId: "synaptry-db",
      storageBucket: "synaptry-db.firebasestorage.app",
      messagingSenderId: "980184606882",
      appId: "1:980184606882:web:c5302bdf71b63e37db4ffb"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 폼 입력 데이터 객체 획득 함수
    function getFormData() {
      return {
        title: document.getElementById("title").value,
        author: document.getElementById("author").value,
        category: document.getElementById("category").value,
        aiModel: document.getElementById("aiModel").value,
        password: document.getElementById("password").value,
        summary: document.getElementById("summary").value,
        content: document.getElementById("content").value
      };
    }

    // 기존 복원 데이터 복구
    window.addEventListener("DOMContentLoaded", () => {
      const savedData = sessionStorage.getItem("draftPost");
      if (savedData) {
        const draft = JSON.parse(savedData);
        document.getElementById("title").value = draft.title || "";
        document.getElementById("author").value = draft.author || "";
        document.getElementById("category").value = draft.category || "Hardware";
        document.getElementById("aiModel").value = draft.aiModel || "";
        document.getElementById("password").value = draft.password || "";
        document.getElementById("summary").value = draft.summary || "";
        document.getElementById("content").value = draft.content || "";
      }
    });

    // 미리보기 버튼 클릭 시 임시 저장 후 preview.html 로 이동
    document.getElementById("previewBtn").addEventListener("click", () => {
      const formData = getFormData();
      sessionStorage.setItem("draftPost", JSON.stringify(formData));
      window.location.href = "preview.html";
    });

    // 포스트 최종 등록
    document.getElementById("writeForm").addEventListener("submit", (e) => {
      e.preventDefault();

      const formData = getFormData();
      formData.createdAt = new Date().toISOString();

      push(ref(db, "posts"), formData)
        .then(() => {
          sessionStorage.removeItem("draftPost"); // 등록 성공 시 임시 저장 데이터 삭제
          alert("포스트가 성공적으로 발행되었습니다!");
          window.location.href = "index.html";
        })
        .catch((error) => {
          alert("발행 실패: " + error.message);
        });
    });
  </script>
</body>
</html>
